name: tiny-fixture-tests

on:
  push:
    branches: [main, codex/initial-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-cpu.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: ruff check .
